<!doctype html>
<html lang="en">
  <head>
    <!-- ======================================================
       META DATA
       ====================================================== -->

    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Makes the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser tab title -->
    <title>Name Finder</title>

    <!-- ======================================================
       STYLESHEETS
       ====================================================== -->

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="assets/CSS/styles.css" />

    <!-- ======================================================
       GOOGLE FONTS
       ====================================================== -->

    <!-- Establish early connections for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Import Oxanium and Roboto fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ======================================================
       PAGE HEADER
       ====================================================== -->

    <header class="hero font-styles">
      <!-- Logo and website title -->
      <div class="hero-logo">
        <img
          id="logo-img"
          src="assets/images/star-citizen-icon-35492.png"
          alt="Star Citizen Logo"
        />

        <h1>Star Citizen Player Lookup</h1>
      </div>
    </header>
    <div id="video-background-container">
      <video autoplay muted loop playsinline class="video-background">
        <source src="assets/video/banner.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>

      <!-- ======================================================
       MAIN CONTENT
       ====================================================== -->

      <main>
        <!-- Application title -->
        <h1 id="verse-intel">Verse Intel Database</h1>

        <!-- ======================================================
         PLAYER LOOKUP
         ====================================================== -->

        <section class="lookup font-styles">
          <h2>UEE Database</h2>

          <!-- Search form -->
          <form id="search-form">
            <div class="form-row">
              <label for="player-name">Player Name:</label>

              <input id="player-name" type="text" />
            </div>
            <div class="button-row">
              <button type="button" id="search-button" class="btn">
                Search UEE
              </button>
            </div>
          </form>
        </section>

        <!-- ======================================================
         SEARCH RESULTS
         ====================================================== -->

        <!--
      JavaScript dynamically inserts player information
      into this section after a search.
    -->
        <section id="search-results">
          <img class="results-img" id="display-profile-picture" src="" />
          <div class="results">
            <h2 class="results-styles">Citizen Name:</h2>
            <p class="results-font" id="display-handle"></p>
            <h2 class="results-styles">Enlisted Date:</h2>
            <p id="display-enlisted"></p>
          </div>
          <img class="results-img" id="org-img" src="" />
          <div class="results" id="org-info">
            <h2 class="results-styles">ORG Name:</h2>
            <p id="display-org"></p>
            <h2 class="results-styles">ORG Members:</h2>
            <p id="display-members"></p>
            <h2 class="results-styles">Rank in ORG:</h2>
            <p id="display-rank"></p>
          </div>
          <h2 id="no-org"></h2>
        </section>

        <!-- ======================================================
       UEE Loading coming soon
       ====================================================== -->
        <!-- <div id="loading-screen">

        <h2>USS PERSONNEL DATABASE</h2>

        <p id="loading-text">
          Searching Citizen Records...
        </p>

      </div>

 -->
      </main>
    </div>
    <!-- ======================================================
       JAVASCRIPT
       ====================================================== -->

    <!-- Main application logic -->
    <script src="assets/JS/script.js"></script>
  </body>
</html>
